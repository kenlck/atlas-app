name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas
      TEST_DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas
      BETTER_AUTH_SECRET: ci-better-auth-secret-32-chars-min
      BETTER_AUTH_URL: http://127.0.0.1:3000
      ADMIN_API_SECRET: ci-admin-api-secret-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: |
          pnpm start &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/sign-in >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/sign-in >/dev/null
      - run: pnpm visual-shots
        env:
          BASE_URL: http://127.0.0.1:3000
          VISUAL_OUT: artifacts
      - run: pnpm autosave-flush
        env:
          BASE_URL: http://127.0.0.1:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-shots
          path: artifacts/**/*.png
      - run: docker build -t atlas-app .

  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/lint-tokens.mjs

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://atlas:atlas@localhost:5432/atlas
      BETTER_AUTH_SECRET: ci-better-auth-secret-32-chars-min
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BASE_URL: http://127.0.0.1:3000
      ATLAS_CONTAINER: atlas-verify
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Throwaway admin secret
        run: |
          secret=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$secret"
          echo "ADMIN_API_SECRET=$secret" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build image at head
        run: |
          sha=$(git rev-parse HEAD)
          docker build -t atlas-app -t "atlas-app:${sha}" .
          echo "ATLAS_IMAGE=atlas-app:${sha}" >> "$GITHUB_ENV"
      - name: Migrate and start the image
        run: |
          echo "CMD docker run --rm --network host -e DATABASE_URL ${ATLAS_IMAGE} node migrate.mjs"
          docker run --rm --network host -e DATABASE_URL "$ATLAS_IMAGE" node migrate.mjs
          echo "CMD docker run -d --name atlas-verify --network host -e DATABASE_URL -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL -e ADMIN_API_SECRET ${ATLAS_IMAGE}"
          docker run -d --name atlas-verify --network host \
            -e DATABASE_URL -e BETTER_AUTH_SECRET -e BETTER_AUTH_URL -e ADMIN_API_SECRET \
            -e HOST=127.0.0.1 -e PORT=3000 \
            "$ATLAS_IMAGE"
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/sign-in >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/sign-in >/dev/null
      - run: pnpm exec playwright install --with-deps chromium
      - name: Fail condition recipes
        run: |
          sha=$(git rev-parse HEAD)
          mkdir -p "artifacts/${sha}/logs"
          run_one() {
            local name=$1
            shift
            set +e
            "$@" > "artifacts/${sha}/logs/${name}.log" 2>&1
            local code=$?
            set -e
            cat "artifacts/${sha}/logs/${name}.log"
            if [[ $code -ne 0 ]]; then
              echo "recipe ${name} failed"
              exit "$code"
            fi
          }
          run_one fail1 ./scripts/verify-fail-conditions.sh 1
          run_one fail2 ./scripts/verify-fail-conditions.sh 2
          run_one fail3 ./scripts/verify-fail-conditions.sh 3
          run_one fail4 ./scripts/verify-fail-conditions.sh 4
          run_one fail5a ./scripts/verify-fail-conditions.sh 5a
          run_one fail5e ./scripts/verify-fail-conditions.sh 5e
          run_one fail5b ./scripts/verify-fail-conditions.sh 5b
          run_one fail5h ./scripts/verify-fail-conditions.sh 5h
          run_one fail5c ./scripts/verify-fail-conditions.sh 5c
          run_one fail5d ./scripts/verify-fail-conditions.sh 5d
          run_one fail5f ./scripts/verify-fail-conditions.sh 5f
          run_one fail5g ./scripts/verify-fail-conditions.sh 5g
          run_one forgot-password ./scripts/verify-fail-conditions.sh forgot-password
          run_one design-lock ./scripts/verify-fail-conditions.sh design-lock
          run_one fail6 ./scripts/verify-fail-conditions.sh 6
      - name: Screenshots
        run: |
          sha=$(git rev-parse HEAD)
          mkdir -p "artifacts/${sha}/logs"
          set +e
          pnpm visual-shots > "artifacts/${sha}/logs/screenshots.log" 2>&1
          code=$?
          set -e
          cat "artifacts/${sha}/logs/screenshots.log"
          exit "$code"
      - name: Screenshot baselines
        run: |
          sha=$(git rev-parse HEAD)
          mkdir -p "artifacts/${sha}/logs"
          set +e
          docker run --rm --network host \
            -v "$PWD:/work" -w /work \
            -e ATLAS_PLAYWRIGHT_IMAGE=mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea \
            -e BASE_URL=http://127.0.0.1:3000 \
            -e ADMIN_API_SECRET \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea \
            node node_modules/@playwright/test/cli.js test -c playwright.visual.config.ts \
            > "artifacts/${sha}/logs/baselines.log" 2>&1
          code=$?
          set -e
          cat "artifacts/${sha}/logs/baselines.log"
          exit "$code"
      - name: Baseline side by side
        if: always()
        run: |
          git fetch origin main
          sha=$(git rev-parse HEAD)
          mkdir -p "artifacts/${sha}/logs"
          BASELINE_FROM=origin/main pnpm exec tsx scripts/baseline-side-by-side.ts \
            > "artifacts/${sha}/logs/baseline-side-by-side.log" 2>&1 || true
          cat "artifacts/${sha}/logs/baseline-side-by-side.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/
